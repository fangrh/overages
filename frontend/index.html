<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>superGDS Studio</title>
<link rel="stylesheet" href="/studio.css">
</head>
<body>
<div id="toolbar">
  <button id="open-folder-btn">Open Folder</button>
  <input type="file" id="folder-input" webkitdirectory style="display:none">
  <button id="run-btn" disabled>▶ Run</button>
  <button id="rebuild-btn" disabled>⟳ Rebuild</button>
  <select id="file-select" disabled><option>No file open</option></select>
</div>

<div id="panels">
  <div id="editor-pane">
    <div id="monaco-editor"></div>
  </div>
  <div id="resize-handle" class="resize-handle"></div>
  <div id="viewer-pane">
    <iframe id="gds-viewer" src="/viewer/viewer.html"></iframe>
  </div>
</div>

<div id="terminal">
  <div id="terminal-header">
    <span>Terminal</span>
    <button id="clear-terminal">clear</button>
  </div>
  <div id="terminal-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
<script>
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' } });
  require(['vs/editor/editor.main'], function() {
    window.monaco = monaco;
    // Load all chunks sequentially to ensure window globals are set before init()
    var s1 = document.createElement('script');
    s1.src = '/monacoSetup.js';
    s1.onload = function() {
      var s2 = document.createElement('script');
      s2.src = '/terminal.js';
      s2.onload = function() {
        var s3 = document.createElement('script');
        s3.src = '/iframeBridge.js';
        s3.onload = function() {
          var s4 = document.createElement('script');
          s4.src = '/studio.js';
          document.body.appendChild(s4);
        };
        document.body.appendChild(s3);
      };
      document.body.appendChild(s2);
    };
    document.head.appendChild(s1);
  });
</script>
</body>
</html>
