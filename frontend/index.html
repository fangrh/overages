<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>overGDS Studio</title>
<link rel="stylesheet" href="/studio.css">
<link rel="stylesheet" href="/xtermCss.css">
</head>
<body>
<!-- Menu Bar — full-width top bar (VS Code style) -->
<div id="menu-bar">
  <div id="menu-brand">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
      <!-- IC chip body -->
      <rect x="5" y="5" width="14" height="14" rx="2" stroke="#89b4fa" stroke-width="1.5"/>
      <!-- Inner die -->
      <rect x="8" y="8" width="8" height="8" rx="1" fill="#89b4fa" opacity="0.25" stroke="#89b4fa" stroke-width="1"/>
      <!-- Pins -->
      <line x1="9" y1="2" x2="9" y2="5" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="2" x2="12" y2="5" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15" y1="2" x2="15" y2="5" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="9" y1="19" x2="9" y2="22" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15" y1="19" x2="15" y2="22" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="9" x2="5" y2="9" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="12" x2="5" y2="12" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="15" x2="5" y2="15" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="9" x2="22" y2="9" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="12" x2="22" y2="12" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="15" x2="22" y2="15" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">overGDS</span>
  </div>
  <div class="menu-item" id="menu-file">
    <span class="menu-title">File</span>
    <div class="menu-dropdown" id="file-dropdown">
      <div class="menu-option" id="menu-open-folder">
        <span>Open Project…</span>
        <span class="menu-shortcut">⌘O</span>
      </div>
      <div class="menu-option" id="menu-new-project">
        <span>New Project…</span>
        <span class="menu-shortcut">⌘N</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-option has-submenu" id="menu-open-recent">
        <span>Open Recent</span>
        <span class="menu-arrow">▶</span>
        <div class="menu-submenu" id="recent-workspaces-list">
          <div class="menu-option disabled"><span>No recent projects</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Content row: Activity Bar + Sidebar + Main Column -->
<div id="content-row">
<!-- Left: Activity Bar + Sidebar -->
<div id="left-panel">
  <!-- Activity Bar (left icons) -->
  <div id="activity-bar">
    <div id="activity-explorer" class="activity-icon active" title="Explorer">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
      </svg>
    </div>
  </div>

  <!-- Sidebar with File Explorer -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">EXPLORER</span>
      <button id="refresh-file-tree" class="sidebar-action" title="Refresh Explorer">↻</button>
    </div>
    <div id="file-tree"></div>
  </div>
</div>

<!-- Right: Main column with Content only -->
<div id="main-column">
  <!-- Main Content (Editor + Viewer + Terminal) -->
  <div id="main-content">
    <!-- Toolbar -->
    <div id="toolbar">
      <span id="current-file" class="current-file-label">No file open</span>
      <div style="flex: 1;"></div>
      <select id="python-env-select" title="Python Environment">
        <option value="">Detecting environments...</option>
      </select>
      <div id="layout-group">
        <button id="btn-layout" class="layout-btn" title="Layout">
          <span id="layout-icon">⬚</span>
        </button>
        <div id="layout-menu" class="layout-menu hidden">
          <div class="layout-menu-header">Layout Options</div>
          <div class="layout-option" data-mode="split">
            <span class="layout-icon-text">◫</span> Split View
          </div>
          <div class="layout-option" data-mode="editor">
            <span class="layout-icon-text">◧</span> Editor Only
          </div>
          <div class="layout-option" data-mode="viewer">
            <span class="layout-icon-text">◨</span> Viewer Only
          </div>
          <div class="layout-menu-divider"></div>
          <div class="layout-option" id="open-viewer-new-tab">
            <span class="layout-icon-text">⧉</span> Open Viewer in New Tab
          </div>
        </div>
      </div>
      <button id="run-btn" disabled>▶ Run</button>
      <button id="rebuild-btn" disabled>⟳ Rebuild</button>
    </div>

    <!-- Tab bar (Overleaf-style) -->
    <div id="tab-bar">
      <div id="editor-tab" class="tab active">
        <span class="tab-label">Editor</span>
      </div>
      <div id="viewer-tab" class="tab active">
        <span class="tab-label">GDS</span>
        <button class="tab-close" id="viewer-tab-close" title="Close Viewer">×</button>
      </div>
    </div>

    <!-- Panels: Editor + Viewer -->
    <div id="panels">
      <div id="editor-pane">
        <div id="monaco-editor"></div>
      </div>
      <div id="resize-handle" class="resize-handle"></div>
      <div id="viewer-pane">
        <!-- Overleaf-style collapse toggle -->
        <div id="viewer-collapse-toggle" class="collapse-toggle collapse-toggle-left" title="Hide Viewer (Ctrl+\)">
          <span>◀</span>
        </div>
        <iframe id="gds-viewer" src="/viewer/viewer.html"></iframe>
      </div>
    </div>

    <!-- Vertical resize handle — drag the top edge of the console up/down -->
    <div id="terminal-resize-handle" class="resize-handle-v" title="Drag to resize console"></div>

    <!-- Terminal -->
    <div id="terminal">
      <div id="terminal-header">
        <span class="tab-bar" style="display:flex;align-items:center;gap:2px;"></span>
        <div style="flex: 1;"></div>
        <span id="terminal-settings" class="terminal-settings-btn" title="Terminal Settings">⚙</span>
        <div id="terminal-settings-dropdown" class="hidden">
          <div class="terminal-settings-option" data-mode="off">
            <span class="check">○</span> Off
          </div>
          <div class="terminal-settings-option" data-mode="auto">
            <span class="check">○</span> Auto
          </div>
          <div class="terminal-settings-option" data-mode="clipboard">
            <span class="check">○</span> Clipboard
          </div>
        </div>
      </div>
      <div id="terminal-body">
        <div id="terminal-xterm" class="terminal-tab-panel"></div>
        <div id="terminal-output" class="terminal-tab-panel"></div>
        <div id="terminal-problems" class="terminal-tab-panel"></div>
      </div>
    </div>
  </div>
</div>
</div><!-- /#content-row -->

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
<script>
  // xterm.js is bundled locally via esbuild (see frontend/studio.ts); no CDN needed.
  // Monaco is still loaded from the CDN below.
  loadMonaco();

  function loadMonaco() {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' } });
    require(['vs/editor/editor.main'], function() {
      window.monaco = monaco;
      var s1 = document.createElement('script');
      s1.src = '/monacoSetup.js';
      s1.onload = function() {
        var sTm = document.createElement('script');
        sTm.src = '/tabManager.js';
        sTm.onload = function() {
          var s2 = document.createElement('script');
          s2.src = '/terminal.js';
          s2.onload = function() {
            var s3 = document.createElement('script');
            s3.src = '/iframeBridge.js';
            s3.onload = function() {
              var s4 = document.createElement('script');
              s4.src = '/studio.js';
              document.body.appendChild(s4);
            };
            document.body.appendChild(s3);
          };
          document.body.appendChild(s2);
        };
        document.body.appendChild(sTm);
      };
      document.head.appendChild(s1);
    });
  }
</script>
</body>
</html>
