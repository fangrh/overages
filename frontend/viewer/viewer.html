// ============================================================
// shapeToYAML
// ============================================================
function shapeToYAML(sg) {
    var lines = [];
    lines.push('shape: ' + sg.type);
    if (sg.coordinates) lines.push('coordinates: ' + JSON.stringify(sg.coordinates));
    if (sg.bbox) lines.push('bbox: ' + JSON.stringify(sg.bbox));
    if (sg.width !== undefined) lines.push('width: ' + sg.width);
    if (sg.height !== undefined) lines.push('height: ' + sg.height);
    if (sg.center) lines.push('center: ' + JSON.stringify(sg.center));
    if (sg.radius !== undefined) lines.push('radius: ' + sg.radius);
    if (sg.length !== undefined) lines.push('length: ' + sg.length);
    if (sg.area !== undefined) lines.push('area: ' + sg.area);
    return lines;
}

// ============================================================
// Console toggle
// ============================================================
function toggleConsole() {
    var c = document.getElementById('console');
    var icon = document.querySelector('#console-header span[title="Collapse"]');
    var willCollapse = !c.classList.contains('collapsed');
    if (willCollapse) {
        // Remember the current (possibly user-dragged) height so a later expand
        // restores it instead of snapping back to the 200px CSS default. Clearing
        // the inline height lets #console.collapsed { height: 32px } take effect —
        // an inline height would otherwise outrank the .collapsed rule.
        c.dataset.height = c.style.height || (c.offsetHeight + 'px');
        c.style.height = '';
        c.classList.add('collapsed');
    } else {
        c.classList.remove('collapsed');
        c.style.height = c.dataset.height || '';
        delete c.dataset.height;
    }
    if (icon) {
        icon.innerHTML = willCollapse ? '&#9654;' : '&#9660;';
    }
}

// Copy the active console panel's text to the clipboard. The Info and Source
// panels (provenance + generated code) are what gets pasted into an LLM, so
// the button copies whichever text panel TabManager currently has on top.
// Inactive panels are display:none, so the first visible candidate wins.
async function copyActivePanel(ev) {
    if (ev) { ev.stopPropagation(); }
    var candidates = ['info-panel', 'source-panel', 'viewer-log-panel'];
    var active = null;
    for (var i = 0; i < candidates.length; i++) {
        var el = document.getElementById(candidates[i]);
        if (el && getComputedStyle(el).display !== 'none') { active = el; break; }
    }
    if (!active) return;
    var text = (active.innerText || '').trim();
    if (!text) return;
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
        } else {
            throw new Error('Clipboard API unavailable');
        }
    } catch (e) {
        // Fallback for non-secure contexts / older browsers.
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(ta);
    }
    var btn = document.getElementById('console-copy-btn');
    if (btn) {
        btn.classList.add('copied');
        btn.textContent = 'Copied ✓';
        setTimeout(function () {
            btn.classList.remove('copied');
            btn.textContent = 'Copy';
        }, 1200);
    }
}

// ============================================================
// Multi-terminal panel (shares TermPanel with the main IDE).
// Lazily created the first time the Terminal tab is opened, so no PTY is
// spawned until the user asks.
// ============================================================
function ensureViewerTerminal() {
    if (viewerTerm) return;
    // @xterm/addon-fit's UMD exposes window.FitAddon as { FitAddon: [class] },
    // so the constructor is window.FitAddon.FitAddon, not window.FitAddon.
    const FitAddonClass = (window.FitAddon && window.FitAddon.FitAddon) || window.FitAddon;
    if (!window.TermPanel || !window.Terminal || !FitAddonClass) return;
    try {
        viewerTerm = new window.TermPanel(
            document.getElementById('viewer-term-panel'),
            { Terminal: window.Terminal, FitAddon: FitAddonClass }
        );
    } catch (e) { console.error('viewer terminal init failed', e); }
}

// ============================================================
// Copy YAML (adapted for VS Code webview postMessage)
// ============================================================
function copyYAML(e) {
    e.stopPropagation();
    var features = selectedFeatures.getArray();
    if (features.length === 0) return;

    var drawnFeatures = features.filter(function(f) { return f.get('isDrawn'); });
    var gdsFeatures = features.filter(function(f) { return !f.get('isDrawn'); });

    var lines = [];

    if (gdsFeatures.length > 0) {
        // GDS components: show as xxx.py Component N: Line X, bbox:[...]
        var seenCallChain = {};
        gdsFeatures.forEach(function(f, idx) {
            var prov = f.get('provenance') || {};
            var meta = f.get('meta') || {};
            var g = f.getGeometry();
            var fBbox = g ? geomExtentToBbox(g.getExtent()) : [];
            var bboxStr = '[' + fBbox.map(function(v) { return v.toFixed(4); }).join(', ') + ']';
            var base = (prov.file || '').split('/').pop();
            var lineNum = prov.line || '?';
            lines.push(base + ' Component ' + (idx + 1) + ': Line ' + lineNum + ', bbox:' + bboxStr);
            // Include call chain so AI agent sees full compilation context
            var chain = _normalizeCallChain(prov);
            if (chain.length > 0) {
                lines.push('  call_chain:');
                chain.forEach(function(cc) {
                    var loc = '@' + (cc.file || '') + '#' + (cc.line || '?');
                    var fn = cc.function ? ' (' + cc.function + ')' : '';
                    var key = loc + fn;
                    if (!seenCallChain[key]) {
                        seenCallChain[key] = true;
                        lines.push('    - ' + loc + fn);
                    }
                });
            }
        });
    }

    if (drawnFeatures.length > 0) {
        if (lines.length > 0) lines.push('');
        if (drawnFeatures.length === 1 && gdsFeatures.length === 0) {
            var sg = getShapeGeom(drawnFeatures[0]);
            lines = lines.concat(shapeToYAML(sg));
        } else {
            lines.push('annotations:');
            drawnFeatures.forEach(function(f) {
                var sg = getShapeGeom(f);
                lines.push('  - shape: ' + sg.type);
                if (sg.bbox) lines.push('    bbox: ' + JSON.stringify(sg.bbox));
                if (sg.width !== undefined) lines.push('    width: ' + sg.width);
                if (sg.height !== undefined) lines.push('    height: ' + sg.height);
                if (sg.center) lines.push('    center: ' + JSON.stringify(sg.center));
                if (sg.radius !== undefined) lines.push('    radius: ' + sg.radius);
                if (sg.length !== undefined) lines.push('    length: ' + sg.length);
                if (sg.area !== undefined) lines.push('    area: ' + sg.area);
            });
        }
    }

    if (lines.length === 0) {
        lines = ['# No data to copy'];
    }

    var text = lines.join('\n');
    vscode && vscode.postMessage({ type: 'exportYaml', yaml: text });
    var btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Copy YAML'; btn.classList.remove('copied'); }, 2000);
}

// ============================================================
// Handle messages from extension
// ============================================================
window.addEventListener('message', function(event) {
    var message = event.data;
    switch (message.type) {
        case 'ping':
            // Respond to iframeBridge polling (used in standalone/VS Code both)
            if (vscode) vscode.postMessage({ type: 'webviewReady' });
            else if (window.parent !== window) window.parent.postMessage({ type: 'webviewReady' }, '*');
            break;
        case 'loadGds':
            loadGdsData(
                message.geojson,
                message.gdsPath,
                message.pythonFile || '',
                message.annotations || [],
                message.mode
            );
            break;
        case 'setMode':
            currentMode2 = message.mode;
            var indicator = document.getElementById('mode-indicator');
            indicator.textContent = message.mode === 'full' ? 'Provenance: ON' : 'Provenance: OFF';
            indicator.className = message.mode === 'full' ? '' : 'partial';
            break;
        case 'annotationSaved':
            drawSource.getFeatures().forEach(function(f) {
                if (f.get('clientId') === message.clientId) {
                    applySavedAnnotation(f, message.annotation);
                }
            });
            onSelectionChanged();
            break;
        case 'selectBySource':
            _selectFeaturesBySource((message.file || '').replace(/\\/g, '/'), message.line);
            break;
    }
});

// ============================================================
// Keep OpenLayers canvas sized to its container
// ============================================================
var _pendingFit = false;
new ResizeObserver(function() {
    var prevSize = map.getSize();
    map.updateSize();
    var newSize = map.getSize();
    // If map went from zero/near-zero to a real size, fit the view to data
    var wasTiny = !prevSize || prevSize[0] < 10 || prevSize[1] < 10;
    var nowBig = newSize && newSize[0] >= 10 && newSize[1] >= 10;
    if ((wasTiny && nowBig) || _pendingFit) {
        _pendingFit = false;
        if (allFeatures.length > 0) {
            fitView();
        }
    }
}).observe(document.getElementById('map'));

        '.sa-gtab .gtab-close:hover { background: #f38ba8; color: #cdd6f4; }' +
        '.sa-gtab-empty { display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-style: italic; color: #585b70; white-space: nowrap; }';
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    // Header: title + actions (one level above the tab strip).
    var header = document.createElement('div');
    header.id = 'sa-header';
    header.innerHTML =
        '<span class="sa-title">GDS Viewer</span>' +
        '<div style="flex:1"></div>' +
        '<button class="sa-btn sa-compile" id="sa-compile" title="Compile — runs the script open in overGDS Studio and reloads this viewer">▶ Compile</button>' +
        '<select class="sa-env" id="sa-env" title="Python Environment"><option value="">Detecting…</option></select>' +
        '<button class="sa-btn sa-dockback" id="sa-dockback" title="Dock back into overGDS Studio">⤢ Dock Back</button>';
    document.body.appendChild(header);

    // GDS-result tab strip (sits one level below the action header).
    var tabbar = document.createElement('div');
    tabbar.id = 'sa-gdstabs';
    document.body.appendChild(tabbar);

    var tabs = [];      // [{ id, label, data }]
    var activeId = null;

    function renderTabs() {
        tabbar.innerHTML = '';
        if (tabs.length === 0) {
            var hint = document.createElement('div');
            hint.className = 'sa-gtab-empty';
            hint.textContent = 'No GDS built yet — press Compile';
            tabbar.appendChild(hint);
            return;
        }
        tabs.forEach(function (tab) {
            var el = document.createElement('div');
            el.className = 'sa-gtab' + (tab.id === activeId ? ' active' : '');
            el.title = (tab.data && tab.data.gdsPath) || tab.label;
            var label = document.createElement('span');
            label.textContent = tab.label;
            el.appendChild(label);
            var close = document.createElement('button');
            close.className = 'gtab-close'; close.title = 'Close'; close.textContent = '×';
            close.addEventListener('click', function (e) { e.stopPropagation(); closeTab(tab.id); });
            el.addEventListener('click', function () { activateTab(tab.id); });
            el.appendChild(close);
            tabbar.appendChild(el);
        });
    }
    function loadTab(tab) {
        if (!tab || !tab.data) return;
        try { loadGdsData(tab.data.geojson, tab.data.gdsPath, tab.data.pythonFile, tab.data.annotations, tab.data.mode); }
        catch (err) { console.error('standalone load failed', err); }
        // Baseline the file's mtime so the auto-refresh poller (defined below)
        // fires only when the GDS is regenerated AFTER this load, not for the
        // load itself. seedWatchedMtime is hoisted within this IIFE.
        if (tab.data.gdsPath) seedWatchedMtime(tab.data.gdsPath);
    }
    function activateTab(id) {
        var tab = null;
        for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) tab = tabs[i];
        if (!tab) return;
        activeId = id;
        loadTab(tab);
        renderTabs();
    }
    function closeTab(id) {
        var idx = -1;
        for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) idx = i;
        if (idx < 0) return;
        tabs.splice(idx, 1);
        if (activeId === id) {
            var next = tabs[idx] || tabs[idx - 1] || null;
            if (next) activateTab(next.id);
            else activeId = null;
        }
        renderTabs();
    }
    function addTab(data) {
        var raw = data && data.gdsPath ? String(data.gdsPath) : '';
        var id = raw.replace(/\\/g, '/') || ('gds-' + (tabs.length + 1));
        var label = basename(raw) || 'GDS';
        var existing = null;
        for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) existing = tabs[i];
        if (existing) { existing.data = data; existing.label = label; }
        else tabs.push({ id: id, label: label, data: data });
        activeId = id;
        loadTab(existing || tabs[tabs.length - 1]);
        renderTabs();
    }

    renderTabs();

    // Populate envs + restore the shared studio-python-env cookie.
    fetch('/api/python-environments').then(function (r) { return r.ok ? r.json() : { environments: [] }; })
      .then(function (d) {
        var sel = document.getElementById('sa-env');
        var envs = d.environments || [];
        sel.innerHTML = envs.length ? '' : '<option value="">Python (default)</option>';
        envs.forEach(function (env) {
            var o = document.createElement('option');
            o.value = env.path; o.textContent = env.name; o.title = env.path;
            if (env.isActive) o.selected = true;
            sel.appendChild(o);
        });
        var raw = (document.cookie.split(';').map(function (s) { return s.trim(); })
            .filter(function (s) { return s.indexOf('studio-python-env=') === 0; })[0] || '');
        var saved = raw.split('=').slice(1).join('=');
        if (saved) sel.value = decodeURIComponent(saved);
        sel.addEventListener('change', function () {
            if (sel.value) document.cookie = 'studio-python-env=' + encodeURIComponent(sel.value) +
                ';max-age=31536000;path=/;SameSite=Lax';
        });
      }).catch(function () {

      });

    // Compile: read the file open in the studio from /api/ide-state, run it,
    // and add a result tab for the freshly built GDS.
    document.getElementById('sa-compile').addEventListener('click', function () {
        fetch('/api/ide-state').then(function (r) { return r.json(); }).then(function (st) {
            var file = st.openFile;
            var sel = document.getElementById('sa-env');
            var btn = document.getElementById('sa-compile');
            if (!file) { alert('No file is open in overGDS Studio to compile.'); return; }
            var pythonPath = sel.value;
            var param = pythonPath ? '&pythonPath=' + encodeURIComponent(pythonPath) : '';
            btn.disabled = true; btn.textContent = '⏳ Compiling…';
            var es = new EventSource('/api/run?pythonFile=' + encodeURIComponent(file) + param);
            es.addEventListener('complete', function (e) {
                addTab(JSON.parse(e.data));
                es.close();
                btn.disabled = false; btn.textContent = '▶ Compile';
            });
            es.addEventListener('error', function () {
                es.close();
                btn.disabled = false; btn.textContent = '▶ Compile';
            });
        });
    });

    document.getElementById('sa-dockback').addEventListener('click', function () {
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'dockBack', pane: 'viewer' }, '*');
        }
        window.close();
    });

    // ---- Auto-refresh: reload the shown GDS when it's regenerated on disk ----
    // The standalone viewer gets no loadGds messages from a parent, so without
    // this a rebuild run in the parent IDE, the terminal, or any external
    // process leaves this window showing stale geometry. Stat-poll the file's
    // mtime (inotify is unreliable across the NTFS-via-WSL2 workspace mount)
    // and re-parse when it advances. Mirrors the parent IDE's pollGdsMtime.
    var watchedMtime = 0;
    var lastMtimePoll = 0;

    function seedWatchedMtime(gdsPath) {
        if (!gdsPath) { watchedMtime = 0; return; }
        fetch('/api/gds-stat?path=' + encodeURIComponent(gdsPath))
            .then(function (r) { return r.ok ? r.json() : { exists: false, mtimeMs: 0 }; })
            .then(function (s) { watchedMtime = s.exists ? s.mtimeMs : 0; })
            .catch(function () { watchedMtime = 0; });
    }

    function autoRefreshLog(msg) {
        var p = document.getElementById('viewer-log-panel');
        if (!p) return;
        var ph = p.querySelector('.placeholder');
        if (ph) ph.remove();
        var line = document.createElement('div');
        line.textContent = msg;
        line.style.cssText = 'color:#a6e3a1;padding:2px 0;';
        p.appendChild(line);
        p.scrollTop = p.scrollHeight;
    }

    function reloadShownGds() {
        var gdsPath = currentGdsPath;
        if (!gdsPath) return;
        var sel = document.getElementById('sa-env');
        var pythonPath = sel ? sel.value : '';
        fetch('/api/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gdsPath: gdsPath, pythonPath: pythonPath })
        })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                if (!d || !d.geojson) { seedWatchedMtime(gdsPath); return; }
                // loadGdsData preserves the viewport on reload. pythonFile is
                // unknown on a pure re-parse, so reuse the current one; pass no
                // annotations (they're user drawings, not part of the GDS).
                loadGdsData(d.geojson, gdsPath, currentPythonFile, [], d.mode);
                // Keep the standalone tab's cached payload in sync so switching
                // away and back doesn't show the pre-rebuild geometry.
                var id = gdsPath.replace(/\\/g, '/');
                for (var i = 0; i < tabs.length; i++) {
                    if (tabs[i].id === id) {
                        tabs[i].data = Object.assign({}, d, { gdsPath: gdsPath, pythonFile: currentPythonFile });
                        break;
                    }
                }
                autoRefreshLog('↻ Auto-refreshed ' + basename(gdsPath) + ' (file changed on disk)');
                seedWatchedMtime(gdsPath);
            })
            .catch(function (e) {
                console.error('[auto-refresh] reload failed', e);
                seedWatchedMtime(gdsPath);
            });
    }

    function pollAutoRefresh() {
        var now = Date.now();
        if (now - lastMtimePoll < 2000) return;   // self-throttle to every 2s
        lastMtimePoll = now;
        var gdsPath = currentGdsPath;
        if (!gdsPath) return;
        fetch('/api/gds-stat?path=' + encodeURIComponent(gdsPath))
            .then(function (r) { return r.ok ? r.json() : { exists: false, mtimeMs: 0 }; })
            .then(function (s) {
                if (!s.exists) return;
                if (!watchedMtime) { watchedMtime = s.mtimeMs; return; }   // first baseline
                if (s.mtimeMs > watchedMtime) {
                    watchedMtime = s.mtimeMs;   // optimistic; reload re-seeds for real
                    reloadShownGds();
                }
            })
            .catch(function () {});
    }

    setInterval(pollAutoRefresh, 1000);

    // Inherit the main IDE's GDS-result state so a freshly popped-out viewer
    // shows the already-built GDS without recompiling.
    window.addEventListener('message', function (e) {
        var msg = e.data || {};
        if (msg.type === 'popupState' && msg.pane === 'viewer' && msg.viewerState) {
            var st = msg.viewerState;
            (st.tabs || []).forEach(function (t) { tabs.push({ id: t.id, label: t.label, data: t.data }); });
            var sel = document.getElementById('sa-env');
            if (st.env && sel) sel.value = st.env;
            if (st.activeId) activateTab(st.activeId);
            else if (tabs.length) activateTab(tabs[tabs.length - 1].id);
            renderTabs();
        }
    });

    // Ask the opener for inherited state.
    if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'popupReady', pane: 'viewer' }, '*');
    }
})();

// Console drag-to-resize: drag the bar above the console to grow/shrink it.
// Pure DOM, so it works both in the embedded iframe and the popout window.
// Calls viewerTerm.fitActive() so the xterm terminal stays crisp while resizing.
(function initConsoleResize() {
    var resizer = document.getElementById('console-resizer');
    var consoleEl = document.getElementById('console');
    if (!resizer || !consoleEl) return;

    var dragging = false;
    var startY = 0;
    var startHeight = 0;
    var fitRaf = 0;

    function fitTerminal() {
        if (window.viewerTerm && typeof window.viewerTerm.fitActive === 'function') {
            try { window.viewerTerm.fitActive(); } catch (_) {}
        }
    }

    resizer.addEventListener('mousedown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        // If collapsed, expand first (from the 32px baseline) so an upward drag
        // grows it smoothly instead of jumping to the 200px default.
        if (consoleEl.classList.contains('collapsed')) {
            consoleEl.classList.remove('collapsed');
            consoleEl.style.height = '32px';
            var icon = document.querySelector('#console-header span[title="Collapse"]');
            if (icon) icon.innerHTML = '&#9660;';
        }
        startY = e.clientY;
        startHeight = consoleEl.offsetHeight;
        consoleEl.style.transition = 'none';   // no lag while following the cursor
        resizer.classList.add('dragging');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'ns-resize';
    });

    document.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        var dy = e.clientY - startY;               // drag up (dy<0) => taller console
        var newHeight = startHeight - dy;
        var minH = 32;
        var maxH = Math.max(minH + 40, window.innerHeight - 100);  // keep the map visible
        if (newHeight > maxH) newHeight = maxH;
        if (newHeight < minH) newHeight = minH;
        consoleEl.style.height = newHeight + 'px';
        if (fitRaf) cancelAnimationFrame(fitRaf);
        fitRaf = requestAnimationFrame(fitTerminal);   // throttle the xterm refit
    });

    document.addEventListener('mouseup', function () {
        if (!dragging) return;
        dragging = false;
        consoleEl.style.transition = '';          // restore the CSS height transition
        resizer.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        if (fitRaf) { cancelAnimationFrame(fitRaf); fitRaf = 0; }
        fitTerminal();
    });
})();
</script>
</body>
